# In the reverse proxy of the production AS2 server: every message of a partner goes to production as before, and a
# copy to the shadow server. The partner gets only the answer of production; nginx discards the one of the mirror.

location = /Receiver.aspx {
    mirror /as24net-shadow;
    mirror_request_body on;
    proxy_pass http://production-as2;               # as it is today
}

location = /as24net-shadow {
    internal;
    proxy_pass http://shadow-host:8080/as2;         # the gateway of samples/shadow/docker-compose.yml
    # Without the header AS24Net answers with a synchronous MDN (discarded here) and never learns the partner's URL:
    # the first barrier, before shadow mode and the network of the shadow server.
    proxy_set_header Receipt-Delivery-Option "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    # nginx closes the partner's connection only after the mirror finished; a slow shadow server must not hold it up.
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
}

# Not mirrored: /MDN.aspx. Those are MDNs for messages production sent, which the shadow server never sent.
