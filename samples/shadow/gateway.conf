# The only way into the shadow server: the mirror of the production proxy (/as2) and the administration.
server {
    listen 8080;
    client_max_body_size 200m;

    location / {
        proxy_pass http://as24net:8080;
        # With the port: behind an SSH tunnel or another port the redirects (e.g. to /Login) have to keep it.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Blazor Server keeps a WebSocket open.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
