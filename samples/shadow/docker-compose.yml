# AS24Net in shadow mode next to the production AS2 server: the reverse proxy of production mirrors the messages
# of partners to this server (see production-nginx.conf), which processes them and sends nothing back.
#
# Two barriers keep it from reaching partners:
#   1. Shadow:Enabled: no asynchronous MDNs, no send queue, no connection tests, no hooks, no webhooks.
#   2. The network "internal" has no route out of the host. AS24Net and its database are only on it; the gateway,
#      the only container on both networks, lets requests in (the mirror and the administration) and nothing out.
#
# Signing in with Microsoft Entra ID needs the internet, so the administration is used with a password here.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: as24net
      POSTGRES_PASSWORD: as24net
      POSTGRES_DB: as24net
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U as24net -d as24net"]
      interval: 5s
      retries: 20

  as24net:
    image: ${AS24NET_IMAGE:-ghcr.io/jskrobak/as24net:latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__AS24Net: Host=postgres;Database=as24net;Username=as24net;Password=as24net
      Shadow__Enabled: "true"
      # The certificate of the production identity is imported; no own one is created.
      Certificates__GenerateCertificate: "false"
      ReverseProxy__TrustAll: "true"
    volumes:
      - data:/data
    networks: [internal]

  gateway:
    image: nginx:1.29-alpine
    depends_on: [as24net]
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${SHADOW_PORT:-8080}:8080"
    networks: [internal, edge]

networks:
  internal:
    internal: true
  edge: {}

volumes:
  postgres:
  data:
